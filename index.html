<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSK Podiatry Triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #C8F000;
    --green-dim: #a8cc00;
    --dark: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --surface3: #2e2e2e;
    --text: #f0f0f0;
    --text-muted: #888;
    --text-hint: #484848;
    --border: rgba(255,255,255,0.08);
    --border-med: rgba(255,255,255,0.14);
    --radius: 16px;
    --font: 'DM Sans', system-ui, sans-serif;
    --red: #E24B4A;
    --red-bg: rgba(226,75,74,0.1);
    --red-border: rgba(226,75,74,0.25);
    --green-bg: rgba(200,240,0,0.08);
    --green-border: rgba(200,240,0,0.25);
    --blue: #5b9cf6;
    --blue-bg: rgba(91,156,246,0.1);
    --amber: #f5a623;
    --amber-bg: rgba(245,166,35,0.1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    font-family: var(--font);
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── LAYOUT ─────────────────────────────────── */
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ─── HEADER ──────────────────────────────────── */
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header-logo {
    width: 34px; height: 34px;
    background: var(--green);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .header-logo svg { width: 18px; height: 18px; }
  .header-text { flex: 1; }
  .header-title { font-size: 13px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; }
  .header-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .header-mode-badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 20px;
  }
  .badge-patient { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .badge-clinician { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(91,156,246,0.25); }

  /* ─── PROGRESS ────────────────────────────────── */
  #progress-wrap {
    background: var(--surface);
    padding: 10px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .prog-meta { display: flex; justify-content: space-between; margin-bottom: 7px; }
  .prog-section { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
  .prog-count { font-size: 11px; color: var(--text-hint); }
  .prog-track { height: 3px; background: var(--surface3); border-radius: 2px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.35s cubic-bezier(.4,0,.2,1); }

  /* ─── QUESTION AREA ───────────────────────────── */
  #question-area {
    flex: 1;
    padding: 24px 20px 16px;
    overflow-y: auto;
  }

  .section-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    border-radius: 5px; padding: 3px 9px;
    margin-bottom: 14px;
  }
  .q-headline { font-size: 21px; font-weight: 800; line-height: 1.2; margin-bottom: 6px; }
  .q-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.55; }

  .warn-banner {
    background: var(--red-bg);
    border: 1px solid var(--red-border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 18px;
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 12px; color: #f09595; line-height: 1.55;
  }
  .warn-banner svg { flex-shrink: 0; margin-top: 1px; }

  .options-list { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 16px;
    cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    transition: border-color 0.12s, background 0.12s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .opt:hover { border-color: var(--border-med); background: var(--surface2); }
  .opt.selected { border-color: var(--green); background: var(--green-bg); }
  .opt.none-opt { margin-top: 4px; }
  .opt-marker {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--text-hint);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
  }
  .opt.sq .opt-marker { border-radius: 5px; }
  .opt.selected .opt-marker { background: var(--green); border-color: var(--green); }
  .opt-marker svg { display: none; width: 11px; height: 11px; }
  .opt.selected .opt-marker svg { display: block; }
  .opt-label { font-size: 14px; font-weight: 500; flex: 1; transition: color 0.12s; }
  .opt.selected .opt-label { color: var(--green); }
  .opt.none-opt .opt-label { color: var(--text-muted); }
  .opt.none-opt.selected .opt-label { color: var(--green); }

  /* ─── SCALE ───────────────────────────────────── */
  .scale-card {
    background: var(--surface2);
    border-radius: 16px;
    padding: 22px 20px 18px;
    margin-bottom: 14px;
  }
  .scale-num-big {
    font-size: 64px; font-weight: 800; color: var(--green);
    text-align: center; line-height: 1; margin-bottom: 6px;
    letter-spacing: -2px;
  }
  .scale-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-hint); margin-bottom: 14px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px;
    background: var(--surface3); border-radius: 2px; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--green); border: 3px solid var(--dark);
    box-shadow: 0 0 0 2px rgba(200,240,0,0.3);
  }
  .scale-ticks { display: flex; justify-content: space-between; margin-top: 8px; padding: 0 2px; }
  .scale-tick { font-size: 10px; color: var(--text-hint); }

  /* ─── FOLLOWUP & FREETEXT ─────────────────────── */
  .followup-block {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 14px;
  }
  .followup-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px; }
  textarea {
    width: 100%;
    background: var(--surface3);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    padding: 12px 14px;
    resize: none;
    outline: none;
    line-height: 1.6;
    transition: border-color 0.12s;
  }
  textarea:focus { border-color: rgba(200,240,0,0.35); }
  textarea::placeholder { color: var(--text-hint); }
  .freetext-main { margin-top: 4px; }

  /* ─── NAV BAR ──────────────────────────────────── */
  #nav-bar {
    padding: 12px 20px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; gap: 10px;
  }
  .btn-back {
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text-muted);
    font-family: var(--font);
    font-size: 14px; font-weight: 600;
    padding: 13px 18px;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.12s, color 0.12s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-back:hover { border-color: var(--border-med); color: var(--text); }
  .btn-next {
    flex: 1;
    background: var(--green);
    border: none; border-radius: 12px;
    color: #000; font-family: var(--font);
    font-size: 15px; font-weight: 800;
    padding: 14px 20px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background 0.12s, transform 0.08s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-next:hover { background: var(--green-dim); }
  .btn-next:active { transform: scale(0.98); }
  .hidden { display: none !important; }

  /* ─── SUMMARY VIEW ────────────────────────────── */
  #summary-view {
    flex: 1;
    overflow-y: auto;
  }
  .sum-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sum-patient-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .sum-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--blue-bg); color: var(--blue);
    font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; border: 1px solid rgba(91,156,246,0.2);
  }
  .sum-name { font-size: 18px; font-weight: 800; }
  .sum-meta { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .sum-flag-badge {
    margin-top: 10px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
    padding: 5px 12px; border-radius: 20px;
  }
  .flag-clear { background: rgba(100,200,120,0.12); color: #6dc87e; border: 1px solid rgba(100,200,120,0.25); }
  .flag-red { background: var(--red-bg); color: #f09595; border: 1px solid var(--red-border); }

  .sum-body { padding: 20px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 12px 10px; }
  .kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-muted); margin-bottom: 4px; }
  .kpi-val { font-size: 22px; font-weight: 800; color: var(--text); line-height: 1; }
  .kpi-unit { font-size: 12px; font-weight: 400; color: var(--text-muted); }
  .kpi-bar { height: 3px; border-radius: 2px; margin-top: 6px; background: var(--surface3); overflow: hidden; }
  .kpi-fill { height: 100%; border-radius: 2px; }

  .sum-section { margin-bottom: 20px; }
  .sum-section-title {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-hint); margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .sum-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .sum-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 14px; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .sum-row:last-child { border-bottom: none; }
  .sr-label { font-size: 12px; color: var(--text-muted); flex-shrink: 0; max-width: 45%; line-height: 1.4; padding-top: 1px; }
  .sr-val { font-size: 13px; font-weight: 500; color: var(--text); text-align: right; line-height: 1.4; }

  .chips-wrap { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 58%; }
  .chip {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    background: var(--surface2); color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .chip-g { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
  .chip-b { background: var(--blue-bg); color: var(--blue); border-color: rgba(91,156,246,0.25); }

  .quote-box {
    background: var(--surface2);
    border-left: 3px solid var(--green);
    border-radius: 0 10px 10px 0;
    padding: 12px 14px;
    font-size: 13px; color: var(--text-muted);
    font-style: italic; line-height: 1.6;
  }
  .quote-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-hint); margin-bottom: 8px; font-style: normal; }

  .goal-card {
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: 14px;
    padding: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .goal-icon {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--green); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .goal-icon svg { width: 20px; height: 20px; }
  .goal-text { font-size: 14px; font-weight: 700; color: var(--green); line-height: 1.3; }
  .goal-sub { font-size: 11px; color: rgba(200,240,0,0.5); margin-top: 2px; }

  .scale-summary { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .ss-num { font-size: 24px; font-weight: 800; min-width: 30px; }
  .ss-track { flex: 1; height: 4px; background: var(--surface3); border-radius: 2px; overflow: hidden; }
  .ss-fill { height: 100%; border-radius: 2px; }

  .red-flag-item {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 10px 14px;
    background: var(--red-bg); border: 1px solid var(--red-border);
    border-radius: 10px; margin-bottom: 6px;
    font-size: 13px; color: #f09595;
  }
  .red-flag-clear {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 14px;
    background: rgba(100,200,120,0.08); border: 1px solid rgba(100,200,120,0.2);
    border-radius: 10px;
    font-size: 13px; color: #6dc87e;
  }

  .sum-actions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  .act-btn {
    flex: 1; min-width: 140px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text-muted);
    font-family: var(--font);
    font-size: 13px; font-weight: 600;
    padding: 12px 16px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.12s, color 0.12s;
    line-height: 1.4;
  }
  .act-btn:hover { border-color: var(--border-med); color: var(--text); }
  .act-btn svg { vertical-align: -3px; margin-right: 6px; }
  .act-btn-primary {
    background: var(--green); border-color: var(--green); color: #000; font-weight: 800;
  }
  .act-btn-primary:hover { background: var(--green-dim); border-color: var(--green-dim); color: #000; }

  /* ─── PRINT ───────────────────────────────────── */
  @media print {
    body { background: #fff; color: #000; }
    #app { max-width: 100%; }
    #questionnaire-view, #nav-bar, .sum-actions { display: none; }
    .app-header { position: static; }
    #summary-view { display: block !important; }
    .sum-card, .kpi-card { border: 1px solid #ccc; background: #fafafa; }
    .quote-box { border-left-color: #333; background: #f5f5f5; }
    .goal-card { background: #f0ffe0; border-color: #aad400; }
  }

  @media (max-width: 520px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="app-header" id="app-header">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C8 2 5 5 5 8c0 4 3 6 3 10h8c0-4 3-6 3-10 0-3-3-6-7-6z"/>
        <line x1="9" y1="21" x2="15" y2="21"/><line x1="10" y1="18" x2="14" y2="18"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="header-title">MSK Podiatry Triage</div>
      <div class="header-sub" id="header-sub">Foot &amp; Ankle Assessment</div>
    </div>
    <div class="header-mode-badge badge-patient" id="mode-badge">Patient</div>
  </div>

  <!-- QUESTIONNAIRE VIEW -->
  <div id="questionnaire-view" style="display:flex;flex-direction:column;flex:1">
    <div id="progress-wrap">
      <div class="prog-meta">
        <span class="prog-section" id="prog-section">Red flags</span>
        <span class="prog-count" id="prog-count">1 / 22</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:4.5%"></div></div>
    </div>
    <div id="question-area" style="flex:1;overflow-y:auto"></div>
    <div id="nav-bar">
      <button class="btn-back hidden" id="btn-back" onclick="prevQ()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15,18 9,12 15,6"/></svg>
        Back
      </button>
      <button class="btn-next" id="btn-next" onclick="nextQ()">
        Continue
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9,18 15,12 9,6"/></svg>
      </button>
    </div>
  </div>

  <!-- SUMMARY VIEW (hidden until complete) -->
  <div id="summary-view" class="hidden"></div>

</div>

<script>
const QUESTIONS = [
  {
    id:'red_flags', section:'Red flags', type:'multi',
    headline:'Are any of the following present?',
    sub:'Select all that apply. These help us prioritise your care safely.',
    warn:true,
    options:['Recent significant injury or trauma','Sudden inability to weight bear','Hot, red, swollen foot or ankle','Fever or feeling generally unwell','Unexplained weight loss','Severe night pain','Previous cancer','New numbness or weakness'],
    none:'None of the above'
  },
  {
    id:'side', section:'Location', type:'single',
    headline:'Which side is affected?',
    options:['Left','Right','Both']
  },
  {
    id:'location', section:'Location', type:'multi',
    headline:'Where is your problem located?',
    sub:'Select all that apply.',
    options:['Heel','Arch','Midfoot','Big toe','Lesser toes','Forefoot','Ankle (inside)','Ankle (outside)','Achilles tendon','Calf','Other']
  },
  {
    id:'duration', section:'History', type:'single',
    headline:'How long have symptoms been present?',
    options:['Less than 6 weeks','6–12 weeks','3–6 months','6–12 months','More than 12 months']
  },
  {
    id:'referral_reason', section:'Your goals', type:'multi',
    headline:'Why have you come to MSK Podiatry today?',
    sub:'Select all that apply.',
    options:['Pain relief','Diagnosis','Treatment advice','Return to sport','Return to work','Improved walking','Prevent surgery','Second opinion','Other']
  },
  {
    id:'cause_belief', section:'Your beliefs', type:'multi',
    headline:'What do you think is causing your problem?',
    options:['Overuse','Injury','Arthritis','Poor footwear','Flat feet','High arches','Ageing','Weight','Previous injury','I don\'t know']
  },
  {
    id:'avoided', section:'Impact', type:'multi',
    headline:'Activities stopped due to worry about worsening?',
    sub:'Select all that apply.',
    options:['Walking','Running','Exercise','Gym','Stairs','Work activities','Other'],
    none:'None — I haven\'t stopped anything'
  },
  {
    id:'movement_belief', section:'Your beliefs', type:'single',
    headline:'Do you think movement is helping or harming you?',
    options:['Mostly helping','Mostly harming','Unsure']
  },
  {
    id:'treatments', section:'History', type:'multi',
    headline:'What treatments have you already tried?',
    options:['Exercises','Orthoses','Physiotherapy','Podiatry','Steroid injection','Shockwave therapy','Medication','Surgery','None'],
    followups:[
      {key:'tx_helped', label:'Which treatment helped the most?'},
      {key:'tx_least',  label:'Which treatment helped the least?'}
    ]
  },
  {
    id:'limited', section:'Impact', type:'multi',
    headline:'Which activities are most limited by your condition?',
    options:['Walking','Running','Exercise','Work','Standing','Stairs','Hobbies','Sleep'],
    followups:[{key:'priority_activity', label:'Which would you most like to improve first?'}]
  },
  {
    id:'confidence_improve', section:'Mindset', type:'scale',
    headline:'How confident are you this problem can improve?',
    sub:'0 = Not at all confident · 10 = Completely confident',
    min:0, max:10
  },
  {
    id:'recovery_time', section:'Expectations', type:'single',
    headline:'How long do you expect recovery to take?',
    options:['Less than 2 weeks','2–6 weeks','6–12 weeks','3–6 months','More than 6 months','Unsure']
  },
  {
    id:'treatment_pref', section:'Preferences', type:'multi',
    headline:'What treatment do you think would help most?',
    options:['Education and advice','Exercises','Orthoses','Footwear modification','Hands-on treatment','Injection','Surgery','Unsure']
  },
  {
    id:'barriers', section:'Barriers', type:'multi',
    headline:'What might make rehabilitation difficult?',
    options:['Lack of time','Pain during exercise','Fear of causing damage','Forgetfulness','Motivation','Work commitments','Caring responsibilities','Unsure whether it will help','Other'],
    freetext:{key:'barriers_other', label:'Anything else? (optional)', placeholder:'Tell us more…'}
  },
  {
    id:'importance', section:'Motivation', type:'scale',
    headline:'How important is improving this problem right now?',
    sub:'0 = Not important · 10 = Extremely important',
    min:0, max:10,
    followups:[{key:'importance_why', label:'Why that number and not lower?'}]
  },
  {
    id:'self_efficacy', section:'Motivation', type:'scale',
    headline:'How confident you can follow a treatment plan?',
    sub:'0 = Not confident · 10 = Very confident',
    min:0, max:10,
    followups:[{key:'self_eff_boost', label:'What would help move you one point higher?'}]
  },
  {
    id:'one_goal', section:'Your goals', type:'freetext',

const SECTION_COLORS = {
  'Red flags':  {fg:'#f09595', bg:'rgba(226,75,74,0.1)',  border:'rgba(226,75,74,0.25)'},
  'Location':   {fg:'#C8F000', bg:'rgba(200,240,0,0.08)', border:'rgba(200,240,0,0.25)'},

  'Your goals': {fg:'#C8F000', bg:'rgba(200,240,0,0.08)', border:'rgba(200,240,0,0.25)'},
  'Your beliefs':{fg:'#ffb060',bg:'rgba(255,165,60,0.1)', border:'rgba(255,165,60,0.25)'},
  'Impact':     {fg:'#ff8080', bg:'rgba(255,100,100,0.1)',border:'rgba(255,100,100,0.25)'},

};

let current = 0;
let answers = {};
let scaleVals = {};
QUESTIONS.forEach(q => { if (q.type === 'scale') scaleVals[q.id] = 5; });

function renderQ() {
  const q = QUESTIONS[current];
  const fill = ((current + 1) / QUESTIONS.length * 100).toFixed(1);
  document.getElementById('prog-fill').style.width = fill + '%';
  document.getElementById('prog-count').textContent = (current+1) + ' / ' + QUESTIONS.length;
  document.getElementById('prog-section').textContent = q.section;
  document.getElementById('btn-back').classList.toggle('hidden', current === 0);

  const col = SECTION_COLORS[q.section] || SECTION_COLORS['Location'];
  let html = '';

  html += `<div class="section-tag" style="color:${col.fg};background:${col.bg};border:1px solid ${col.border}">${q.section}</div>`;
  html += `<div class="q-headline">${q.headline}</div>`;
  if (q.sub) html += `<div class="q-sub">${q.sub}</div>`;

  if (q.warn) {
    html += `<div class="warn-banner"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><div>If any of these are present your referral may be fast-tracked for urgent review. Please be as accurate as possible.</div></div>`;
  }

  if (q.type === 'single' || q.type === 'multi') {
    const multi = q.type === 'multi';
    html += `<div class="options-list">`;
    q.options.forEach(opt => {
      const sel = (answers[q.id] || []).includes(opt) ? 'selected' : '';
      const enc = opt.replace(/'/g,"\\'").replace(/"/g,'&quot;');
      html += `<div class="opt${multi?' sq':''} ${sel}" onclick="toggleOpt('${q.id}','${enc}',${multi})" role="${multi?'checkbox':'radio'}" aria-checked="${sel?'true':'false'}" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleOpt('${q.id}','${enc}',${multi})}">
        <div class="opt-marker"><svg viewBox="0 0 12 12" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"><polyline points="2,6 5,9 10,3"/></svg></div>
        <span class="opt-label">${opt}</span>
      </div>`;
    });
    if (q.none) {
      const nsel = (answers[q.id] || []).includes('__none__') ? 'selected' : '';
      const nenc = q.none.replace(/'/g,"\\'");
      html += `<div class="opt sq none-opt ${nsel}" onclick="toggleNone('${q.id}')" role="checkbox" aria-checked="${nsel?'true':'false'}" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleNone('${q.id}')}">
        <div class="opt-marker"><svg viewBox="0 0 12 12" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"><polyline points="2,6 5,9 10,3"/></svg></div>
        <span class="opt-label">${q.none}</span>
      </div>`;
    }
    html += `</div>`;
    if (q.followups) {
      q.followups.forEach(fu => {
        html += `<div class="followup-block"><div class="followup-label">${fu.label}</div><textarea rows="2" placeholder="Your answer…" id="fu_${fu.key}" oninput="answers['${fu.key}']=this.value">${answers[fu.key]||''}</textarea></div>`;
      });
    }
    if (q.freetext) {
      html += `<div class="followup-block"><div class="followup-label">${q.freetext.label}</div><textarea rows="2" placeholder="${q.freetext.placeholder}" id="ft_${q.freetext.key}" oninput="answers['${q.freetext.key}']=this.value">${answers[q.freetext.key]||''}</textarea></div>`;
    }
  }

  if (q.type === 'scale') {
    const v = scaleVals[q.id];
    const pct = v * 10;
    const col2 = v >= 7 ? '#6dc87e' : v >= 4 ? '#f5a623' : '#E24B4A';
    html += `<div class="scale-card">
      <div class="scale-num-big" id="sv_${q.id}" style="color:${col2}">${v}</div>
      <div class="scale-ends"><span>0</span><span>10</span></div>
      <input type="range" min="${q.min}" max="${q.max}" step="1" value="${v}" id="range_${q.id}" oninput="updateScale('${q.id}',+this.value)" aria-label="${q.headline}">
      <div class="scale-ticks">${Array.from({length:11},(_,i)=>`<span class="scale-tick">${i}</span>`).join('')}</div>
    </div>`;
    if (q.followups) {
      q.followups.forEach(fu => {
        html += `<div class="followup-block"><div class="followup-label">${fu.label}</div><textarea rows="2" placeholder="Your answer…" id="fu_${fu.key}" oninput="answers['${fu.key}']=this.value">${answers[fu.key]||''}</textarea></div>`;
      });
    }
  }

  if (q.type === 'freetext') {
    html += `<div class="freetext-main"><textarea rows="4" placeholder="${q.placeholder}" id="ft_main_${q.id}" oninput="answers['${q.key}']=this.value" aria-label="${q.headline}">${answers[q.key]||''}</textarea></div>`;
  }

  document.getElementById('question-area').innerHTML = html;
  document.getElementById('question-area').scrollTop = 0;

  const btn = document.getElementById('btn-next');
  btn.innerHTML = current < QUESTIONS.length - 1
    ? 'Continue <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9,18 15,12 9,6"/></svg>'
    : 'Submit <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20,6 9,12 4,9"/><line x1="4" y1="18" x2="20" y2="18"/></svg>';
}

function toggleOpt(qid, val, multi) {
  if (!answers[qid]) answers[qid] = [];
  if (!multi) { answers[qid] = [val]; }
  else {
    const ni = answers[qid].indexOf('__none__');
    if (ni > -1) answers[qid].splice(ni, 1);
    const i = answers[qid].indexOf(val);
    if (i > -1) answers[qid].splice(i, 1); else answers[qid].push(val);
  }
  refreshOpts(qid);
}
function toggleNone(qid) { answers[qid] = ['__none__']; refreshOpts(qid); }

function refreshOpts(qid) {
  const q = QUESTIONS[current];
  document.querySelectorAll('.options-list .opt:not(.none-opt)').forEach((el, i) => {
    const opt = q.options[i];
    const sel = (answers[qid]||[]).includes(opt);
    el.classList.toggle('selected', sel);
    el.setAttribute('aria-checked', sel.toString());
  });
  const nEl = document.querySelector('.none-opt');
  if (nEl) {
    const ns = (answers[qid]||[]).includes('__none__');
    nEl.classList.toggle('selected', ns);
    nEl.setAttribute('aria-checked', ns.toString());
  }
}

function updateScale(qid, v) {
  scaleVals[qid] = v; answers[qid] = v;
  const el = document.getElementById('sv_' + qid);
  if (el) {
    el.textContent = v;
    el.style.color = v >= 7 ? '#6dc87e' : v >= 4 ? '#f5a623' : '#E24B4A';
  }
}

function nextQ() {
  const q = QUESTIONS[current];
  if (q.type === 'scale') answers[q.id] = scaleVals[q.id];
  if (current < QUESTIONS.length - 1) { current++; renderQ(); }
  else { showSummary(); }
}
function prevQ() { if (current > 0) { current--; renderQ(); } }

// ─── SUMMARY ────────────────────────────────────────────
function val(k) { return answers[k]; }
function arrVal(k) { const v = answers[k]; if (!v || v.length === 0) return null; if (v[0] === '__none__') return null; return v; }
function singleVal(k) { const v = arrVal(k); return v ? v[0] : null; }
function textVal(k) { const v = answers[k]; return (v && v.trim()) ? v.trim() : null; }

function chips(arr, cls='') {
  if (!arr || arr.length === 0) return '<span style="color:var(--text-hint);font-size:12px">—</span>';
  return '<div class="chips-wrap">' + arr.map(a => `<span class="chip ${cls}">${a}</span>`).join('') + '</div>';
}
function chip1(v, cls='') {
  return v ? `<span class="chip ${cls}">${v}</span>` : '<span style="color:var(--text-hint);font-size:12px">—</span>';
}

function scoreBar(v, color) {
  return `<div class="scale-summary"><span class="ss-num" style="color:${color}">${v}</span><div class="ss-track"><div class="ss-fill" style="width:${v*10}%;background:${color}"></div></div><span style="font-size:12px;color:var(--text-hint)">/10</span></div>`;
}
function scoreColor(v) { return v >= 7 ? '#6dc87e' : v >= 4 ? '#f5a623' : '#E24B4A'; }

  document.getElementById('questionnaire-view').classList.add('hidden');

  document.getElementById('nav-bar').classList.add('hidden');

  document.getElementById('header-sub').textContent = 'Triage Summary Report';

  const flags = arrVal('red_flags');

  const dateStr = new Date().toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});

  const ci = val('confidence_improve') !== undefined ? val('confidence_improve') : 5;
  const imp = val('importance') !== undefined ? val('importance') : 5;

  const side = singleVal('side');
  const dur = singleVal('duration');
  const refReason = arrVal('referral_reason');
  const cause = arrVal('cause_belief');
  const avoided = arrVal('avoided');
  const movBelief = singleVal('movement_belief');
  const txTried = arrVal('treatments');
  const txHelped = textVal('tx_helped');

  const limited = arrVal('limited');
  const priority = textVal('priority_activity');
  const recTime = singleVal('recovery_time');
  const txPref = arrVal('treatment_pref');
  const barriers = arrVal('barriers');
  const barriersOther = textVal('barriers_other');
  const importanceWhy = textVal('importance_why');
  const selfEffBoost = textVal('self_eff_boost');
  const oneGoal = textVal('one_goal_text');
  const actLevel = singleVal('activity_level');
  const steps = singleVal('steps');
  const activities = arrVal('activities');
  const fwContrib = singleVal('footwear_contrib');
  const fwType = arrVal('footwear_type');

  let html = `
  <div class="sum-header">
    <div class="sum-patient-row">
      <div class="sum-avatar">PT</div>
      <div>
        <div class="sum-name">Patient Submission</div>
        <div class="sum-meta">Submitted ${dateStr} · 22 questions · MSK Podiatry Triage</div>

    </div>
    <div class="sum-flag-badge ${hasFlags ? 'flag-red' : 'flag-clear'}">
      ${hasFlags
        ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Red flags present — review urgently`
        : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg> No red flags identified`
      }
    </div>
  </div>
  <div class="sum-body">

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Duration</div>
        <div class="kpi-val" style="font-size:${dur && dur.length > 10 ? '13px':'22px'}">${dur || '—'}</div>

      <div class="kpi-card">

        <div class="kpi-val" style="color:${scoreColor(imp)}">${imp}<span class="kpi-unit">/10</span></div>
        <div class="kpi-bar"><div class="kpi-fill" style="width:${imp*10}%;background:${scoreColor(imp)}"></div></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Self-efficacy</div>
        <div class="kpi-val" style="color:${scoreColor(se)}">${se}<span class="kpi-unit">/10</span></div>
        <div class="kpi-bar"><div class="kpi-fill" style="width:${se*10}%;background:${scoreColor(se)}"></div></div>
      </div>
    </div>`;

  // Red flags
  html += `<div class="sum-section"><div class="sum-section-title">Red flag screening</div>`;
  if (hasFlags) {
    flags.forEach(f => {
      html += `<div class="red-flag-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="flex-shrink:0;margin-top:1px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg>${f}</div>`;
    });
  } else {
    html += `<div class="red-flag-clear"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg>All red flag items negative — no urgent escalation indicated</div>`;
  }
  html += `</div>`;

  // Location & history
  html += `<div class="sum-section"><div class="sum-section-title">Symptom location &amp; history</div>
    <div class="sum-card">
      <div class="sum-row"><span class="sr-label">Location</span>${chips(locs,'chip-g')}</div>
      <div class="sum-row"><span class="sr-label">Side</span><span class="sr-val">${side||'—'}</span></div>
      <div class="sum-row"><span class="sr-label">Duration</span><span class="sr-val">${dur||'—'}</span></div>

  // Goals & beliefs
  html += `<div class="sum-section"><div class="sum-section-title">Referral goals &amp; beliefs</div>

    </div></div>`;

  // Impact
  html += `<div class="sum-section"><div class="sum-section-title">Impact &amp; avoided activities</div>

      <div class="sum-row"><span class="sr-label">Most limited activities</span>${chips(limited,'chip-g')}</div>
      <div class="sum-row"><span class="sr-label">Priority to improve first</span><span class="sr-val">${priority||'—'}</span></div>
    </div></div>`;

  // Treatment history
  html += `<div class="sum-section"><div class="sum-section-title">Treatment history</div>

      <div class="sum-row"><span class="sr-label">Treatments tried</span>${chips(txTried)}</div>
      <div class="sum-row"><span class="sr-label">Most helpful</span><span class="sr-val">${txHelped||'—'}</span></div>

    </div></div>`;

  // Expectations
  html += `<div class="sum-section"><div class="sum-section-title">Patient expectations</div>

      <div class="sum-row"><span class="sr-label">Expected recovery time</span><span class="sr-val">${recTime||'—'}</span></div>

  html += `<div class="sum-actions">
    <button class="act-btn act-btn-primary" onclick="window.print()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6,9 6,2 18,2 18,9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print / Save PDF
    </button>
    <button class="act-btn" onclick="restartQ()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="1,4 1,10 7,10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      New triage
    </button>
  </div>`;

  html += `</div>`;

  const sv = document.getElementById('summary-view');
  sv.innerHTML = html;
  sv.classList.remove('hidden');
  sv.scrollTop = 0;
}

function restartQ() {
  current = 0; answers = {};
  QUESTIONS.forEach(q => { if (q.type === 'scale') scaleVals[q.id] = 5; });
  document.getElementById('summary-view').classList.add('hidden');
  document.getElementById('questionnaire-view').classList.remove('hidden');
  document.getElementById('progress-wrap').classList.remove('hidden');
  document.getElementById('nav-bar').classList.remove('hidden');
  document.getElementById('mode-badge').textContent = 'Patient';
  document.getElementById('mode-badge').className = 'header-mode-badge badge-patient';
  document.getElementById('header-sub').textContent = 'Foot & Ankle Assessment';
  renderQ();
}

renderQ();
</script>
</body>
</html>
